[pytest]
# Configuración de pytest para el proyecto

# Directorio raíz de los tests
testpaths = tests

# Mostrar los tests individuales y sus resultados
addopts = -v --tb=short

# Que Python encuentre el paquete app/ correctamente
pythonpath = .

# Formato de los nombres de archivo de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filtro de advertencias internas de deallocator en Python 3.14 con openpyxl
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
